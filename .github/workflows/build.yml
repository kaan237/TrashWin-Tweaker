name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: TrashWin-Tweaker
          path: target/release/trashwin-tweaker.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item target/release/trashwin-tweaker.exe TrashWin-Tweaker.exe
          $h = (Get-FileHash TrashWin-Tweaker.exe -Algorithm SHA256).Hash.ToLower()
          "$h  TrashWin-Tweaker.exe" | Out-File -Encoding ascii TrashWin-Tweaker.exe.sha256
          gh release create $env:GITHUB_REF_NAME TrashWin-Tweaker.exe TrashWin-Tweaker.exe.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
